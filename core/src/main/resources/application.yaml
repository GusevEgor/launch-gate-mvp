spring:
  application:
    name: core
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/launch_gate_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 280305
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1


minio:
  internal-url: ${MINIO_INTERNAL_URL:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minio-admin}
  secret-key: ${MINIO_SECRET_KEY:minio-strong-password}
  bucket:
    media-bucket: "media-files"
    json-bucket: "json-files"

server:
  port: 8887


